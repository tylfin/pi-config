[project]
name = "pi-config-evals"
version = "0.0.0"
description = "Behavioral evals for AGENTS.md"
requires-python = ">=3.12"
dependencies = ["pytest==9.1.1"]

[dependency-groups]
dev = ["ruff==0.16.3", "ty==0.0.72"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
